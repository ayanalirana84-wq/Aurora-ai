<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    
    <title>Aurora AI — RonzLabs</title>
    <meta name="description" content="Aurora AI by RonzLabs is a blazing-fast, free intelligent AI assistant for coding, content writing, and debugging.">
    <meta name="theme-color" content="#000000">
    <meta name="color-scheme" content="dark">

    <link rel="canonical" href="https://aurora-ai-ronz.vercel.app/">
    <link rel="icon" type="image/png" href="https://aurora-ai-ronz.vercel.app/favicon.png">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000;
            font-family: system-ui, -apple-system, sans-serif;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
        /* Fallback Permission Overlay in case Chrome blocks iframe auto-prompt */
        #mic-permission-banner {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(20, 20, 25, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 12px 20px;
            border-radius: 12px;
            color: #ffffff;
            font-size: 14px;
            display: none;
            align-items: center;
            gap: 12px;
            z-index: 99999;
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        #mic-permission-banner button {
            background: #6366f1;
            color: white;
            border: none;
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <!-- Full-Screen App Viewport with Explicit Permissions -->
    <iframe 
        id="aurora-frame"
        src="https://aurora-ai.ronzlabsofficial.workers.dev/" 
        title="Aurora AI — Official Smart AI Assistant Interface"
        loading="eager"
        allow="microphone *; camera *; geolocation *; clipboard-read; clipboard-write; fullscreen *"
        allowfullscreen>
    </iframe>

    <!-- Chrome / Mobile Mic Fallback Banner -->
    <div id="mic-permission-banner">
        <span>Enable Microphone for Voice Chat</span>
        <button onclick="requestMicAccess()">Allow Mic</button>
    </div>

    <script>
        // Check and pre-warm microphone permissions on Chrome
        async function requestMicAccess() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                stream.getTracks().forEach(track => track.stop());
                document.getElementById('mic-permission-banner').style.display = 'none';
            } catch (err) {
                console.warn('Microphone permission denied or unavailable:', err);
            }
        }

        // Trigger permission check on load if blocked
        window.addEventListener('DOMContentLoaded', () => {
            navigator.permissions?.query({ name: 'microphone' }).then(result => {
                if (result.state === 'denied') {
                    document.getElementById('mic-permission-banner').style.display = 'flex';
                }
            }).catch(() => {});
        });
    </script>

</body>
</html>
